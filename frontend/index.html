<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Research Agent</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-2: #1e2230;
      --border: #2a2f3e;
      --text: #e6e8ee;
      --muted: #9aa3b5;
      --accent: #6366f1;
      --accent-2: #22d3ee;
      --ok: #34d399;
      --err: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: 0.2px;
    }
    header h1 span { color: var(--accent-2); }
    .doc-badge {
      font-size: 12px;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 20px;
    }
    .doc-badge b { color: var(--ok); font-weight: 600; }
    main { flex: 1; overflow-y: auto; padding: 24px 0; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 0 20px; }

    /* Upload area */
    .upload-zone {
      border: 1.5px dashed var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
      background: var(--panel);
    }
    .upload-zone:hover, .upload-zone.drag { border-color: var(--accent); background: var(--panel-2); }
    .upload-zone b { color: var(--text); }
    input[type="file"] { display: none; }

    /* Messages */
    .msg {
      display: flex;
      margin-bottom: 18px;
      animation: rise 0.25s ease;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
    .msg .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; margin-right: 12px; margin-top: 2px;
    }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .avatar { margin-right: 0; margin-left: 12px; background: var(--panel-2); border: 1px solid var(--border); }
    .msg.user .bubble { background: var(--accent); color: #fff; }
    .msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 14.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble a { color: var(--accent-2); }

    /* Tool call cards */
    .tool-card {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      padding: 10px 14px;
      font-size: 13px;
      animation: rise 0.25s ease;
    }
    .tool-card .tool-head {
      display: flex; align-items: center; gap: 8px;
      font-weight: 600; color: var(--accent-2);
      margin-bottom: 4px;
      font-size: 13px;
    }
    .tool-card .tool-arg { color: var(--muted); margin-bottom: 6px; font-size: 12.5px; }
    .tool-card .tool-result {
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 130px;
      overflow-y: auto;
      font-size: 12.5px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-2);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .thinking {
      color: var(--muted);
      font-size: 13.5px;
      padding: 4px 0 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .err-bubble {
      border-color: var(--err) !important;
      color: var(--err);
    }
    .warn-bubble {
      border-color: #fbbf24 !important;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
    }

    /* Input */
    .input-bar {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 14px 22px 18px;
    }
    .input-wrap {
      max-width: 780px; margin: 0 auto;
      display: flex; gap: 10px;
    }
    textarea {
      flex: 1;
      resize: none;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14.5px;
      padding: 11px 14px;
      font-family: inherit;
      line-height: 1.4;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      padding: 0 22px;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .hint {
      max-width: 780px; margin: 8px auto 0;
      font-size: 12px; color: var(--muted);
      padding: 0 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>AI Research <span>Agent</span></h1>
  <div class="doc-badge">📄 <b id="doc-count">0</b> documents indexed</div>
</header>

<main id="chat">
  <div class="wrap">
    <div class="upload-zone" id="upload-zone">
      <b>📎 Drop a PDF, TXT, or MD file here</b> (or click to browse) —
      the agent can search your documents and the web.
    </div>
    <div id="messages"></div>
  </div>
</main>

<div class="input-bar">
  <div class="input-wrap">
    <textarea id="input" rows="1" placeholder="Ask anything — e.g. 'What's in my uploaded file, and what's the latest news on it?'"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint">The agent decides whether to search your documents, the web, or both.</div>
</div>

<input type="file" id="file-input" accept=".pdf,.txt,.md">

<script>
const chatEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const fileInput = document.getElementById("file-input");
const uploadZone = document.getElementById("upload-zone");
const docCountEl = document.getElementById("doc-count");

let history = [];

/* ---------- helpers ---------- */

function addUserBubble(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="avatar">🧑</div><div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chatEl.appendChild(div);
  scroll();
}

function addThinking() {
  const div = document.createElement("div");
  div.className = "thinking";
  div.innerHTML = `<span class="spinner"></span> thinking, gathering info…`;
  chatEl.appendChild(div);
  scroll();
  return div;
}

function addToolCard(tool, args, result) {
  const card = document.createElement("div");
  card.className = "tool-card";
  const argText = Object.entries(args || {})
    .map(([k, v]) => `<span class="tool-arg"><b>${k}</b>: ${escapeHtml(String(v))}</span>`)
    .join("");
  card.innerHTML = `
    <div class="tool-head">🔧 ${tool}</div>
    ${argText}
    <div class="tool-result">${escapeHtml(result || "no result")}</div>`;
  chatEl.appendChild(card);
  scroll();
}

function addAssistantBubble(text) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble"></div>`;
  const bubble = div.querySelector(".bubble");
  bubble.textContent = text;
  chatEl.appendChild(div);
  scroll();
  return bubble;
}

function addError(text) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble err-bubble"></div>`;
  div.querySelector(".bubble").textContent = "⚠️ " + text;
  chatEl.appendChild(div);
  scroll();
}

function addWarning(text) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `<div class="avatar">🤖</div><div class="bubble warn-bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chatEl.appendChild(div);
  scroll();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function scroll() {
  const main = document.getElementById("chat");
  main.scrollTop = main.scrollHeight;
}

/* ---------- upload ---------- */

uploadZone.addEventListener("click", () => fileInput.click());
uploadZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  uploadZone.classList.add("drag");
});
uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("drag"));
uploadZone.addEventListener("drop", (e) => {
  e.preventDefault();
  uploadZone.classList.remove("drag");
  if (e.dataTransfer.files.length) upload(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length) upload(fileInput.files[0]);
  fileInput.value = "";
});

async function upload(file) {
  const fd = new FormData();
  fd.append("file", file);
  addUserBubble(`📤 Uploading "${file.name}"…`);
  const thinking = addThinking();
  try {
    const res = await fetch("/upload", { method: "POST", body: fd });
    const data = await res.json();
    thinking.remove();
    if (!res.ok) throw new Error(data.detail || "upload failed");
    addAssistantBubble(
      `✅ Indexed "${data.filename}" — ${data.chunks} chunks across ${data.pages} page(s). ` +
      `You can now ask questions about it.`
    );
    refreshDocCount();
  } catch (err) {
    thinking.remove();
    addError(err.message);
  }
}

async function refreshDocCount() {
  try {
    const res = await fetch("/health");
    const data = await res.json();
    docCountEl.textContent = data.docs_indexed ?? 0;
  } catch (_) {}
}

/* ---------- chat ---------- */

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = "";
  inputEl.style.height = "auto";
  addUserBubble(text);

  const thinking = addThinking();
  sendBtn.disabled = true;
  inputEl.disabled = true;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "request failed");
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let answerStarted = false;
    let answerBubble = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split("\n\n");
      buffer = events.pop();

      for (const raw of events) {
        const line = raw.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;

        const ev = JSON.parse(payload);

        if (ev.type === "tool_call") {
          if (!answerStarted) thinking.remove();
          addToolCard(ev.tool, ev.args, ev.result);
        } else if (ev.type === "done") {
          thinking.remove();
          answerBubble = addAssistantBubble(ev.content || "(no answer)");
          history.push({ role: "user", content: text });
          history.push({ role: "assistant", content: ev.content || "" });
          if (history.length > 20) history = history.slice(-20);
        } else if (ev.type === "warning") {
          thinking.remove();
          addWarning(ev.content || "warning");
        } else if (ev.type === "error") {
          thinking.remove();
          addError(ev.error || "unknown error");
        }
      }
    }
    if (!answerStarted && thinking.parentNode) thinking.remove();
  } catch (err) {
    thinking.remove();
    addError(err.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

/* greeting + doc count on load */
addAssistantBubble(
  "👋 Hi! I'm your research agent. Upload a document (PDF, TXT, or MD) and I can answer questions " +
  "about it — plus search the web for the latest information."
);
refreshDocCount();
</script>
</body>
</html>
