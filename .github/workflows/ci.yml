name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check backend/

      - name: Format check with ruff
        run: ruff format --check backend/

      - name: Run tests
        run: |
          if [ -d "backend" ] && ls backend/test_*.py 1> /dev/null 2>&1; then
            pytest backend/ -v --tb=short
          else
            echo "No tests found, skipping"
          fi

      - name: Check imports resolve
        run: |
          python -c "from backend.agent import run_agent_stream; from backend.rag import VectorStore; from backend.tools import TOOL_SCHEMAS; print('All imports OK')"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-research-agent .

      - name: Test Docker image starts
        run: |
          docker run -d --name test-container -p 8000:8000 -e GROQ_API_KEY=test ai-research-agent
          sleep 10
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)
          docker stop test-container