name: Daily Task Reminder

on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC daily
  workflow_dispatch:  # manual trigger

permissions:
  issues: write
  contents: read

jobs:
  daily-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read DAILY_TASKS.md
        id: tasks
        run: |
          # Extract unchecked tasks (lines starting with "- [ ]")
          tasks=$(grep '^- \[ \]' DAILY_TASKS.md | sed 's/^- \[ \] //')
          count=$(echo "$tasks" | grep -c '^' || echo 0)
          if [ "$count" -eq 0 ]; then
            echo "task=All tasks completed! 🎉" >> $GITHUB_OUTPUT
            echo "has_task=false" >> $GITHUB_OUTPUT
          else
            # Pick random task
            task=$(echo "$tasks" | shuf -n 1)
            echo "task=$task" >> $GITHUB_OUTPUT
            echo "has_task=true" >> $GITHUB_OUTPUT
          fi

      - name: Create daily task issue
        if: steps.tasks.outputs.has_task == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const task = '${{ steps.tasks.outputs.task }}';
            const today = new Date().toISOString().split('T')[0];
            const title = `📅 Daily Task for ${today}: ${task}`;
            const body = `## Today's Task (5-10 min)\n\n**${task}**\n\n---\n*Auto-generated from DAILY_TASKS.md. Pick this task, do it, open a PR, and check the box in DAILY_TASKS.md.*\n\n**Labels:** daily-task, good-first-issue`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['daily-task', 'good-first-issue']
            });