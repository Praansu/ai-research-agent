name: Nightly Test Run

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        id: test
        run: |
          # Run tests if they exist, otherwise pass
          if [ -d "backend" ] && [ -f "backend/test_*.py" -o -f "backend/test_*.py" ]; then
            pytest backend/ -v --tb=short 2>&1 | tee test-output.txt
            exit_code=${PIPESTATUS[0]}
          else
            echo "No tests found, creating placeholder test file..."
            mkdir -p backend
            cat > backend/test_placeholder.py << 'EOF'
import pytest

def test_placeholder():
    """Placeholder test - replace with real tests."""
    assert True
EOF
            pytest backend/test_placeholder.py -v
            exit_code=0
          fi
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

      - name: Create issue on test failure
        if: steps.test.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('test-output.txt', 'utf8');
            const today = new Date().toISOString().split('T')[0];
            const title = `🔴 Nightly Tests Failed - ${today}`;
            const body = `## Nightly Test Failure\n\n**Date:** ${today}\n\n**Output:**\n\`\`\`\n${output.slice(-3000)}\n\`\`\`\n\n---\n*Auto-generated from nightly test run. Fix failing tests and close this issue.*`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['test-failure', 'nightly', 'bug']
            });