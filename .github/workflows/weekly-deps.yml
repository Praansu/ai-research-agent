name: Weekly Dependency Update

on:
  schedule:
    - cron: '0 10 * * 1'  # 10 AM UTC every Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pip-tools

      - name: Check for outdated packages
        id: outdated
        run: |
          outdated=$(pip list --outdated --format=json 2>/dev/null || echo '[]')
          echo "outdated=$outdated" >> $GITHUB_OUTPUT
          count=$(echo "$outdated" | jq 'length')
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Create PR with updates
        if: steps.outdated.outputs.count > 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Create branch
          branch="deps/update-$(date +%Y%m%d)"
          git checkout -b "$branch"
          
          # Update requirements.txt with latest compatible versions
          pip install --upgrade -r requirements.txt
          pip freeze > requirements.txt
          
          # Commit and push
          git add requirements.txt
          git commit -m "deps: weekly dependency updates $(date +%Y-%m-%d)"
          git push origin "$branch"
          
          # Create PR
          gh pr create \
            --title "deps: weekly dependency updates $(date +%Y-%m-%d)" \
            --body "Automated weekly dependency update. Review changes and merge if tests pass." \
            --label "dependencies,automated" \
            --base main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}